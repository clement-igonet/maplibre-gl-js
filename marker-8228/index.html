<!DOCTYPE html>
<html lang="en">
<head>
<title>Marker elevation (#8228)</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="dist/maplibre-gl.css">
<style>
    body, html { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    .note { position: absolute; top: 8px; left: 8px; z-index: 2; background: rgba(0,0,0,.8); color: #fff;
            padding: 8px 12px; border-radius: 4px; font: 500 13px system-ui, sans-serif; max-width: 22em; }
    .lbl { background: #1a7f37; color: #fff; padding: 3px 7px; border-radius: 3px;
           font: 700 12px system-ui, sans-serif; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
    .lbl.ground { background: #6e7781; }
</style>
</head>
<body>
<div id="map"></div>
<div class="note" id="note">The default <code>Marker</code>, raised with <code>heightOffset</code>: grey on the ground, blue at +60 m steps above it. The purple one uses <code>heightAnchor: absolute</code> at 2500 m.</div>
<script type="module">
import * as maplibregl from './dist/maplibre-gl-dev.mjs';

const AT = [11.3833, 47.2700];   // Innsbruck, in the valley

const map = new maplibregl.Map({
    container: 'map',
    center: [11.3833, 47.2610],
    zoom: 14.4,
    pitch: 72,
    bearing: 0,
    hash: true,
    maxPitch: 85,
    style: {
        version: 8,
        sources: {
            osm: {type: 'raster', tiles: ['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, maxzoom: 19, attribution: '© OpenStreetMap contributors'},
            terrainSource: {type: 'raster-dem', encoding: 'terrarium', tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'], tileSize: 256, maxzoom: 15, attribution: 'Mapzen/AWS'}
        },
        layers: [{id: 'osm', type: 'raster', source: 'osm'}],
        terrain: {source: 'terrainSource', exaggeration: 1}
    }
});
window.map = map;

function label(text, cls) {
    const el = document.createElement('div');
    el.className = `lbl${cls ? ' ' + cls : ''}`;
    el.textContent = text;
    return el;
}

map.on('load', () => {
    // default markers, the ordinary Marker API, raised with heightOffset
    new maplibregl.Marker({color: '#6e7781'}).setLngLat(AT)
        .setPopup(new maplibregl.Popup().setText('on the ground')).addTo(map);
    for (const floor of [1, 2, 3, 4, 5]) {
        new maplibregl.Marker({heightOffset: floor * 60})
            .setLngLat(AT)
            .setPopup(new maplibregl.Popup().setText(`+${floor * 60} m`))
            .addTo(map);
    }
    // a second location using the absolute anchor, at a fixed altitude
    new maplibregl.Marker({color: '#8250df', heightOffset: 2500, heightAnchor: 'absolute'})
        .setLngLat([11.4133, 47.2860])
        .setPopup(new maplibregl.Popup().setText('2500 m above the datum'))
        .addTo(map);
});
</script>
</body>
</html>
