<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How close can a custom layer object get to the camera?</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="dist/maplibre-gl.css">
<style>
  body { margin: 0; font: 13px/1.5 system-ui, sans-serif; color: #eaf0f6; background: #05070d; }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; z-index: 2; top: 12px; left: 12px; width: 320px; padding: 13px;
           background: rgba(8,13,24,.94); border: 1px solid #24334a; border-radius: 8px; }
  h1 { margin: 0 0 3px; font-size: 15px; }
  p { margin: 0 0 9px; color: #8fa3bb; font-size: 12px; }
  button { display: block; width: 100%; margin: 4px 0; padding: 6px 9px; font: inherit; font-size: 12.5px;
           background: #16233a; color: #eaf0f6; border: 1px solid #2c3e5c; border-radius: 5px; cursor: pointer; text-align: left; }
  button:hover { background: #1e2f4d; }
  table { width: 100%; border-collapse: collapse; margin-top: 9px; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 2px 4px; border-bottom: 1px solid #1d2941; }
  th:first-child, td:first-child { text-align: left; }
  .yes { color: #7ee081 } .no { color: #ff8f8f }
</style>
</head>
<body>
<div id="panel">
  <h1>Custom layer, up close</h1>
  <p>A 12 m triangle drawn by a <code>custom</code> layer at a fixed spot.
     The camera walks toward it. The near plane is derived from the ground, so at some distance the object is clipped away.</p>
  <button id="run">run the sweep</button>
  <table id="out"><thead><tr><th>camera distance</th><th>nearZ</th><th>farZ</th><th>object</th><th>earth</th></tr></thead><tbody></tbody></table>
</div>
<div id="map"></div>

<script type="module">
import * as maplibregl from './dist/maplibre-gl-dev.mjs';

const SITE = [2.3522, 48.8566];
const OBJ_ALT = 500000;      // the object sits in orbit, earth is 500 km behind it
const TRI_COLOUR = [1.0, 0.25, 0.55];          // distinctive, easy to count in a readback

const map = window.__map = new maplibregl.Map({
    container: 'map',
    style: {
        version: 8,
        sources: {osm: {type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256,
                        attribution: '© OpenStreetMap contributors', maxzoom: 18}},
        layers: [{id: 'bg', type: 'background', paint: {'background-color': '#0b1120'}},
                 {id: 'earth', type: 'raster', source: 'osm'}]
    },
    center: SITE, zoom: 12, pitch: 75, bearing: 0,
    maxPitch: 179, preserveDrawingBuffer: true, antialias: true
});

// a triangle standing 12 m tall at SITE, drawn straight through WebGL
const nearLayer = {
    id: 'near-object', type: 'custom', renderingMode: '3d',
    onAdd(_map, gl) {
        const base = maplibregl.MercatorCoordinate.fromLngLat(SITE, OBJ_ALT);
        const perMetre = base.meterInMercatorCoordinateUnits();
        const w = 6 * perMetre, h = 12 * perMetre;
        const verts = new Float32Array([
            base.x - w, base.y, base.z,
            base.x + w, base.y, base.z,
            base.x,     base.y, base.z + h
        ]);
        this.buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
        gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);

        const vs = `#version 300 es
            uniform mat4 u_matrix;
            layout(location=0) in vec3 a_pos;
            void main() { gl_Position = u_matrix * vec4(a_pos, 1.0); }`;
        const fs = `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() { fragColor = vec4(${TRI_COLOUR[0]}, ${TRI_COLOUR[1]}, ${TRI_COLOUR[2]}, 1.0); }`;
        const compile = (type, src) => {
            const s = gl.createShader(type);
            gl.shaderSource(s, src); gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
            return s;
        };
        this.program = gl.createProgram();
        gl.attachShader(this.program, compile(gl.VERTEX_SHADER, vs));
        gl.attachShader(this.program, compile(gl.FRAGMENT_SHADER, fs));
        gl.linkProgram(this.program);
        if (!gl.getProgramParameter(this.program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(this.program));
        this.uMatrix = gl.getUniformLocation(this.program, 'u_matrix');
    },
    render(gl, args) {
        gl.useProgram(this.program);
        gl.uniformMatrix4fv(this.uMatrix, false, args.defaultProjectionData.mainMatrix);
        gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
        gl.disable(gl.DEPTH_TEST);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
};
map.on('load', () => map.addLayer(nearLayer));

/** How many pixels of the triangle's colour reach the screen. */
function trianglePixels() {
    map.redraw();
    const c = map.getCanvas(), off = document.createElement('canvas');
    off.width = c.width; off.height = c.height;
    off.getContext('2d').drawImage(c, 0, 0);
    const d = off.getContext('2d').getImageData(0, 0, off.width, off.height).data;
    let n = 0;
    for (let i = 0; i < d.length; i += 4) {
        if (d[i] > 200 && d[i+1] > 40 && d[i+1] < 110 && d[i+2] > 110 && d[i+2] < 175) n++;
    }
    return n;
}

/** Pixels that look like map tiles rather than the dark background or the triangle. */
function earthPixels() {
    const c = map.getCanvas(), off = document.createElement('canvas');
    off.width = c.width; off.height = c.height;
    off.getContext('2d').drawImage(c, 0, 0);
    const d = off.getContext('2d').getImageData(0, 0, off.width, off.height).data;
    let n = 0;
    for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i+1], b = d[i+2];
        if (r > 90 && g > 90 && b > 90 && !(r > 200 && g < 110 && b > 110 && b < 175)) n++;
    }
    return n;
}

const DISTANCES = [5000, 1000, 300, 100, 30, 10, 5, 2];
window.__sweep = async () => {
    const tbody = document.querySelector('#out tbody');
    tbody.innerHTML = '';
    const rows = [];
    for (const metres of DISTANCES) {
        // stand the camera `metres` away from the triangle, looking at its top
        const opts = map.calculateCameraOptionsFromTo(
            [SITE[0], SITE[1] - metres / 111320], OBJ_ALT + 6, SITE, OBJ_ALT + 12);
        map.jumpTo(opts);
        await new Promise(res => map.once('idle', res));
        await new Promise(res => setTimeout(res, 120));
        const tr = map._camera.transform;
        const px = trianglePixels();
        const earth = earthPixels();
        rows.push({metres, nearZ: tr.nearZ, farZ: tr.farZ, px, earth});
        tbody.insertAdjacentHTML('beforeend',
            `<tr><td>${metres} m</td><td>${tr.nearZ.toFixed(1)}</td><td>${Math.round(tr.farZ)}</td>` +
            `<td class="${px > 50 ? 'yes' : 'no'}">${px > 50 ? 'yes' : 'no'}</td>` +
            `<td class="${earth > 2000 ? 'yes' : 'no'}">${earth > 2000 ? 'yes' : 'no'}</td></tr>`);
    }
    return rows;
};
document.getElementById('run').addEventListener('click', () => window.__sweep());
</script>
</body>
</html>
