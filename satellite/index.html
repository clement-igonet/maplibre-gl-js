<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tracking a satellite at 500 km</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="dist/maplibre-gl.css">
<style>
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; color: #eaf0f6; background: #05070d; }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; z-index: 2; top: 12px; left: 12px; width: 290px; padding: 14px;
           background: rgba(10,16,28,.92); border: 1px solid #24334a; border-radius: 8px; }
  h1 { margin: 0 0 4px; font-size: 15px; }
  p { margin: 0 0 10px; color: #94a7bd; font-size: 12px; }
  button { display: block; width: 100%; margin: 5px 0; padding: 7px 10px; font: inherit; font-size: 13px;
           background: #16233a; color: #eaf0f6; border: 1px solid #2c3e5c; border-radius: 5px; cursor: pointer; text-align: left; }
  button:hover { background: #1e2f4d; }
  button.on { background: #2b6cb0; border-color: #4a8fd0; }
  #readout { margin-top: 10px; padding-top: 9px; border-top: 1px solid #24334a; font-size: 11.5px;
             color: #94a7bd; white-space: pre-line; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="panel">
  <h1>Satellite at 500 km</h1>
  <p>A point in low earth orbit at 500 km, drawn with <code>symbol-height-offset</code>, anchored to the datum.
     Orbit runs at a tenth of real speed. The station sits under the ground track, eye height 1.7 m.</p>
  <button id="space" class="on">1. from space</button>
  <button id="chase">2. alongside the satellite</button>
  <button id="ground-a">3a. from Station A</button>
  <button id="ground-b">3b. from Station B</button>
  <button id="ground-c">3c. from Station C</button>
  <button id="pause">pause orbit</button>
  <p id="readout"></p>
</div>
<div id="map"></div>

<script type="module">
import * as maplibregl from './dist/maplibre-gl-dev.mjs';

const ALT = 500000;                 // metres
const STATIONS = [
    {id: 'a', name: 'Station A', colour: '#f6c177', lngLat: null},
    {id: 'b', name: 'Station B', colour: '#7ee081', lngLat: null},
    {id: 'c', name: 'Station C', colour: '#e06c9f', lngLat: null}
];
let GROUND = [2.3522, 48.8566];     // the station currently being looked from
const PERIOD = 94;                  // minutes, roughly a 500 km orbit
const INCLINATION = 51.6;           // degrees, roughly ISS

let t = 0, running = true, mode = 'space';

// put the station under the ground track so the satellite actually passes overhead,
// the way a real site is chosen for a given orbit
// spread the stations along the ground track so the satellite passes over each in turn
function placeStations() {
    STATIONS.forEach((st, i) => {
        st.lngLat = satAt(i * PERIOD / 3 + 12);
    });
    GROUND = STATIONS[0].lngLat;
}
placeStations();

// a simple circular orbit, good enough to move something believable across the sky
function satAt(minutes) {
    const frac = (minutes % PERIOD) / PERIOD;
    const arg = frac * 2 * Math.PI;
    const lat = Math.asin(Math.sin(INCLINATION * Math.PI / 180) * Math.sin(arg)) * 180 / Math.PI;
    let lng = (Math.atan2(Math.cos(INCLINATION * Math.PI / 180) * Math.sin(arg), Math.cos(arg)) * 180 / Math.PI)
        - frac * 360 * (PERIOD / 1436);       // earth rotation under the orbit
    lng = ((lng + 540) % 360) - 180;
    return [lng, lat];
}

const satFeature = (pos) => ({
    type: 'FeatureCollection',
    features: [{type: 'Feature', properties: {alt: ALT}, geometry: {type: 'Point', coordinates: pos}}]
});

const map = window.__map = new maplibregl.Map({
    container: 'map',
    style: {
        version: 8,
        projection: {type: 'globe'},
        glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
        sources: {
            sat: {type: 'geojson', data: satFeature(satAt(0))},
            site: {type: 'geojson', data: {type: 'FeatureCollection', features: STATIONS.map(st => ({
                type: 'Feature',
                properties: {name: st.name, colour: st.colour},
                geometry: {type: 'Point', coordinates: st.lngLat}
            }))}},
            osm: {type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256,
                  attribution: '© OpenStreetMap contributors', maxzoom: 18}
        },
        layers: [
            {id: 'space', type: 'background', paint: {'background-color': '#05070d'}},
            {id: 'earth', type: 'raster', source: 'osm'},
            {id: 'site', type: 'circle', source: 'site',
             paint: {'circle-radius': 6, 'circle-color': ['get', 'colour'],
                     'circle-stroke-color': '#fff', 'circle-stroke-width': 1.5}},
            {id: 'site-label', type: 'symbol', source: 'site',
             layout: {'text-field': ['get', 'name'], 'text-font': ['Noto Sans Regular'], 'text-size': 11,
                      'text-offset': [0, 1.1], 'text-anchor': 'top', 'text-allow-overlap': true},
             paint: {'text-color': '#dbe6f2', 'text-halo-color': '#05070d', 'text-halo-width': 1.4}},
            {id: 'sat', type: 'symbol', source: 'sat',
             layout: {
                 'text-field': '● satellite',
                 'text-font': ['Noto Sans Regular'],
                 'text-size': 13,
                 'text-offset': [0, 0],
                 'text-allow-overlap': true,
                 'symbol-height-offset': ['get', 'alt'],
                 'symbol-height-anchor': 'absolute'
             },
             paint: {'text-color': '#7ee0ff', 'text-halo-color': '#04121c', 'text-halo-width': 1.6}}
        ]
    },
    center: satAt(0),
    zoom: 3.2,
    maxPitch: 175,                  // needed to look above the horizon
    pitch: 0,
    attributionControl: {compact: true}
});

function setMode(next) {
    mode = next;
    for (const id of MODES) {
        document.getElementById(id).classList.toggle('on', id === next);
    }
    const st = STATIONS.find(x => next === 'ground-' + x.id);
    if (st) GROUND = st.lngLat;
}
const MODES = ['space', 'chase', 'ground-a', 'ground-b', 'ground-c'];
for (const id of MODES) {
    document.getElementById(id).addEventListener('click', () => setMode(id));
}
document.getElementById('pause').addEventListener('click', (e) => {
    running = !running;
    e.target.textContent = running ? 'pause orbit' : 'resume orbit';
});

const R = 6371008.8;          // mean earth radius, metres
const EYE = 1.7;              // observer eye height, metres

function ecef(lngDeg, latDeg, h) {
    const lng = lngDeg * Math.PI / 180, lat = latDeg * Math.PI / 180;
    const r = R + h;
    return [r * Math.cos(lat) * Math.cos(lng), r * Math.cos(lat) * Math.sin(lng), r * Math.sin(lat)];
}

/**
 * Azimuth and elevation of the satellite as seen from the ground station, the same look angles a
 * tracking antenna would use. Elevation is negative while the satellite is below the horizon.
 */
function lookAngles(site, sat) {
    const g = ecef(site[0], site[1], EYE);
    const s = ecef(sat[0], sat[1], ALT);
    const d = [s[0] - g[0], s[1] - g[1], s[2] - g[2]];
    const lng = site[0] * Math.PI / 180, lat = site[1] * Math.PI / 180;
    const up = [Math.cos(lat) * Math.cos(lng), Math.cos(lat) * Math.sin(lng), Math.sin(lat)];
    const east = [-Math.sin(lng), Math.cos(lng), 0];
    const north = [-Math.sin(lat) * Math.cos(lng), -Math.sin(lat) * Math.sin(lng), Math.cos(lat)];
    const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    const range = Math.hypot(d[0], d[1], d[2]);
    const elevation = Math.asin(dot(d, up) / range) * 180 / Math.PI;
    let azimuth = Math.atan2(dot(d, east), dot(d, north)) * 180 / Math.PI;
    if (azimuth < 0) azimuth += 360;
    return {azimuth, elevation, rangeKm: range / 1000};
}

function applyCamera(pos) {
    if (mode === 'space') {
        map.jumpTo({center: pos, zoom: 3.2, pitch: 55, bearing: 0});
        return {note: 'close enough that the 500 km altitude separates from the ground'};
    }
    if (mode === 'chase') {
        // camera just behind and slightly above the satellite, looking at it
        const behind = satAt(t - 2);
        const opts = map.calculateCameraOptionsFromTo(behind, ALT + 60000, pos, ALT);
        map.jumpTo(opts);
        return {note: 'camera at ' + Math.round((ALT + 60000) / 1000) + ' km, looking at the satellite', opts};
    }
    // from a fixed ground station: point the camera along the antenna's look angles.
    // pitch 90 is the horizon, so straight up is 180.
    const look = lookAngles(GROUND, pos);
    // the camera has to sit AT the station: center is what the camera looks at, so placing the
    // station there would look down on it instead of out from it
    const opts = map.calculateCameraOptionsFromTo(GROUND, EYE, pos, ALT);
    map.jumpTo(opts);
    return {
        note: look.elevation < 0 ?
            `below the horizon (elevation ${look.elevation.toFixed(1)}°), nothing to see yet` :
            `az ${look.azimuth.toFixed(0)}°  el ${look.elevation.toFixed(1)}°  range ${Math.round(look.rangeKm)} km`,
        look, opts
    };
}

const readout = document.getElementById('readout');
function frame() {
    if (running) t += 0.025;   // 10x slower than real time for watching
    const pos = satAt(t);
    map.getSource('sat').setData(satFeature(pos));
    let info = {};
    try {
        info = applyCamera(pos);
    } catch (err) {
        info = {note: 'camera error: ' + err.message};
    }
    const tr = map._camera?.transform;
    const alt = tr?.getCameraAltitude ? tr.getCameraAltitude() : NaN;
    readout.textContent =
        `satellite  ${pos[0].toFixed(1)}, ${pos[1].toFixed(1)}  at ${ALT / 1000} km
${info.note}
pitch ${map.getPitch().toFixed(1)}  zoom ${map.getZoom().toFixed(2)}
camera altitude ${Number.isFinite(alt) ? Math.round(alt / 1000) + ' km' : String(alt)}`;
    requestAnimationFrame(frame);
}
map.on('load', () => frame());

window.__t_set = (v) => { t = v; };
window.__probe = (m) => {
    setMode(m);
    const pos = satAt(t);
    let err = null;
    try { applyCamera(pos); } catch (e) { err = e.message; }
    const tr = map._camera?.transform;
    const la = lookAngles(GROUND, pos);
    return {mode: m, pitch: +map.getPitch().toFixed(1), zoom: +map.getZoom().toFixed(1), bearing: Math.round(map.getBearing()),
            elevationDeg: +la.elevation.toFixed(1), azimuthDeg: +la.azimuth.toFixed(0), rangeKm: Math.round(la.rangeKm),
            cameraAltitudeKm: tr?.getCameraAltitude ? tr.getCameraAltitude() / 1000 : null, error: err};
};
</script>
</body>
</html>
