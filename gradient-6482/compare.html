<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>#6482 - vertical gradient, main vs a candidate fix</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../lod-6630/dist-fix/maplibre-gl.css">
<style>
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #f4f6f8; color: #1c2430; }
  header { padding: 12px 18px; background: #fff; border-bottom: 1px solid #dde2e8; }
  h1 { margin: 0 0 4px; font-size: 17px; }
  header p { margin: 0; color: #5a6572; }
  #controls { margin-top: 8px; display: flex; gap: 20px; flex-wrap: wrap; }
  #expect { margin: 10px 0 0; padding: 7px 11px; border-radius: 4px; font-weight: 600; }
  #expect.same { background: #eef2f7; color: #445; }
  #expect.diff { background: #e8f5ec; color: #14532d; }
  #panes { display: flex; gap: 14px; padding: 14px 18px; }
  .pane { flex: 1; background: #fff; border: 1px solid #dde2e8; border-radius: 6px; overflow: hidden; }
  .pane h2 { margin: 0; padding: 8px 12px; font-size: 14px; border-bottom: 1px solid #eceff3; }
  .pane.before h2 { color: #a11; } .pane.after h2 { color: #161; }
  .map { height: 340px; }
  .readout { padding: 10px 12px 14px; }
  .readout .label { display: flex; justify-content: space-between; font-size: 12px; color: #5a6572; margin-bottom: 4px; }
  canvas.strip { width: 100%; height: 54px; display: block; border: 1px solid #dde2e8; border-radius: 3px; image-rendering: pixelated; }
  .verdict { margin-top: 8px; font-weight: 600; font-size: 13px; }
  .verdict.flat { color: #a11; } .verdict.grad { color: #161; }
</style>
</head>
<body>
<header>
  <h1>fill-extrusion-vertical-gradient: main vs a candidate fix</h1>
  <p>One 300 m building. The bar under each map is its wall, sampled pixel by pixel from the top of the wall to the bottom.</p>
  <div id="controls">
    <label><input type="checkbox" id="grad" checked> vertical gradient</label>
    <label><input type="checkbox" id="base" checked> raise the base to 20 m</label>
    <label><input type="checkbox" id="terrain"> 3D terrain (500 m plateau)</label>
  </div>
  <p id="expect"></p>
</header>
<div id="panes">
  <div class="pane before">
    <h2>main</h2>
    <div id="before" class="map"></div>
    <div class="readout">
      <div class="label"><span>top of the wall</span><span>bottom of the wall</span></div>
      <canvas id="strip-before" class="strip" width="300" height="54"></canvas>
      <div id="verdict-before" class="verdict"></div>
    </div>
  </div>
  <div class="pane after">
    <h2>candidate fix</h2>
    <div id="after" class="map"></div>
    <div class="readout">
      <div class="label"><span>top of the wall</span><span>bottom of the wall</span></div>
      <canvas id="strip-after" class="strip" width="300" height="54"></canvas>
      <div id="verdict-after" class="verdict"></div>
    </div>
  </div>
</div>

<script type="module">
import * as mainGl from '../lod-6630/dist-main/maplibre-gl-dev.mjs';
import * as fixGl from './dist-fix/maplibre-gl-dev.mjs';

const makeData = (base) => ({
    type: 'FeatureCollection',
    features: [{
        type: 'Feature', properties: {height: 300, base},
        geometry: {type: 'Polygon', coordinates: [[
            [-0.0006, -0.0006], [0.0006, -0.0006], [0.0006, 0.0006], [-0.0006, 0.0006], [-0.0006, -0.0006]
        ]]}
    }]
});

const FLAT_DEM = (() => {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const ctx = c.getContext('2d');
    const v = (500 + 10000) / 0.1;
    ctx.fillStyle = `rgb(${Math.floor(v / 65536)},${Math.floor((v % 65536) / 256)},${Math.floor(v % 256)})`;
    ctx.fillRect(0, 0, 256, 256);
    return c.toDataURL();
})();

let currentData = makeData(20);

const build = (gl, container) => new gl.Map({
    container,
    preserveDrawingBuffer: true,
    style: {
        version: 8,
        sources: {
            boxes: {type: 'geojson', data: currentData},
            dem: {type: 'raster-dem', tiles: [FLAT_DEM], tileSize: 256, encoding: 'mapbox', maxzoom: 20}
        },
        layers: [
            {id: 'bg', type: 'background', paint: {'background-color': '#16233c'}},
            {id: 'boxes', type: 'fill-extrusion', source: 'boxes', paint: {
                'fill-extrusion-color': '#9aa3ad',
                'fill-extrusion-height': ['get', 'height'],
                'fill-extrusion-base': ['get', 'base'],
                'fill-extrusion-vertical-gradient': true
            }}
        ]
    },
    center: [0, -0.0008], zoom: 17.2, pitch: 70, bearing: 0
});

const maps = {before: build(mainGl, 'before'), after: build(fixGl, 'after')};

function sampleWall(map) {
    map.redraw();                                  // the drawing buffer is only readable right after a draw
    const canvas = map.getCanvas();
    const off = document.createElement('canvas');
    off.width = canvas.width; off.height = canvas.height;
    const ctx = off.getContext('2d');
    ctx.drawImage(canvas, 0, 0);
    const p = map.project([0, -0.0006]);
    const col = ctx.getImageData(Math.round(p.x * devicePixelRatio), 0, 1, off.height).data;

    const px = [];
    for (let y = 0; y < off.height; y++) {
        const r = col[y * 4], g = col[y * 4 + 1], b = col[y * 4 + 2];
        if (b > 45 && r < 45 && g < 55) continue;  // background
        px.push({y, lum: Math.round(0.2126 * r + 0.7152 * g + 0.0722 * b)});
    }
    if (!px.length) return [];
    // the roof caps the column, so drop the first run, but only when it is short enough
    // to actually be the roof: a flat wall is itself one long run
    let i = 1;
    while (i < px.length && px[i].lum === px[0].lum && px[i].y === px[i - 1].y + 1) i++;
    if (i > px.length * 0.4) i = 0;
    return px.slice(i).map(s => s.lum);
}

function draw(which, lums) {
    const canvas = document.getElementById(`strip-${which}`);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const verdict = document.getElementById(`verdict-${which}`);
    if (!lums.length) { verdict.textContent = 'no wall visible'; verdict.className = 'verdict'; return; }
    for (let x = 0; x < canvas.width; x++) {
        const lum = lums[Math.min(lums.length - 1, Math.floor(x / canvas.width * lums.length))];
        ctx.fillStyle = `rgb(${lum},${lum},${lum})`;
        ctx.fillRect(x, 0, 1, canvas.height);
    }
    const min = Math.min(...lums), max = Math.max(...lums);
    const flat = max - min <= 1;
    verdict.className = `verdict ${flat ? 'flat' : 'grad'}`;
    verdict.textContent = flat ?
        `flat: one shade (${min}) from top to bottom, no gradient` :
        `gradient: ${max} at the top down to ${min} at the bottom`;
}

const grad = document.getElementById('grad');
const base = document.getElementById('base');
const terrain = document.getElementById('terrain');

function describe() {
    const el = document.getElementById('expect');
    if (!grad.checked) {
        el.className = 'same';
        el.textContent = 'Gradient switched off on both sides, so both bars are flat.';
    } else if (base.checked || terrain.checked) {
        el.className = 'diff';
        el.textContent = (terrain.checked ? 'On terrain, ' : 'With a raised base, ') +
            'main draws a flat wall with no gradient at all. The fix restores it. The two bars should differ.';
    } else {
        el.className = 'same';
        el.textContent = 'Ground-level base on flat ground: the fix changes nothing, so both bars match on purpose.';
    }
}

const settled = (map) => new Promise(res => {
    const done = () => requestAnimationFrame(() => requestAnimationFrame(res));
    if (map.loaded() && !map.isMoving()) done(); else map.once('idle', done);
});

async function refresh() {
    describe();
    currentData = makeData(base.checked ? 20 : 0);
    for (const map of Object.values(maps)) {
        map.getSource('boxes').setData(currentData);
        map.setPaintProperty('boxes', 'fill-extrusion-vertical-gradient', grad.checked);
        map.setTerrain(terrain.checked ? {source: 'dem', exaggeration: 1} : null);
    }
    await new Promise(res => setTimeout(res, 400));
    await Promise.all(Object.values(maps).map(settled));
    for (const [which, map] of Object.entries(maps)) draw(which, sampleWall(map));
}
for (const el of [grad, base, terrain]) el.addEventListener('change', refresh);

window.__set = async (opts) => {
    grad.checked = opts.gradient !== false;
    base.checked = opts.base !== false;
    terrain.checked = !!opts.terrain;
    await refresh();
    return ['before', 'after'].map(w => `${w}: ${document.getElementById(`verdict-${w}`).textContent}`);
};

let ready = 0;
for (const map of Object.values(maps)) map.on('load', () => map.once('idle', () => { if (++ready === 2) refresh(); }));
</script>
</body>
</html>
