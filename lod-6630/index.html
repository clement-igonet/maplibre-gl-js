<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>#6630 - fill-extrusion height across fractional zooms</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="dist-fix/maplibre-gl.css">
<style>
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: #f6f7f9; color: #222; }
  header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; }
  h1 { margin: 0 0 4px; font-size: 17px; }
  header p { margin: 0; color: #555; }
  header code { background: #eef0f3; padding: 1px 4px; border-radius: 3px; }
  #controls { padding: 10px 16px; background: #fff; border-bottom: 1px solid #ddd; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #controls input[type=range] { flex: 1; min-width: 260px; }
  #zoomLabel { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 110px; }
  #maps { display: flex; gap: 2px; height: calc(100vh - 150px); }
  .pane { flex: 1; position: relative; }
  .map { position: absolute; inset: 0; }
  .tag { position: absolute; z-index: 2; top: 10px; left: 10px; padding: 5px 9px; border-radius: 4px;
         background: rgba(255,255,255,.92); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .tag.before { color: #a11; }
  .tag.after { color: #161; }
  .tag small { display: block; font-weight: 400; color: #555; }
</style>
</head>
<body>
<header>
  <h1>#6630 &mdash; a zoom ramp that lives inside one zoom level</h1>
  <p>Both maps paint <code>fill-extrusion-height</code> with
     <code>["interpolate", ["linear"], ["zoom"], 15, 0, 15.1, ["get", "render_height"]]</code>.
     The buildings should reach full height at zoom&nbsp;15.1.</p>
</header>
<div id="controls">
  <label for="z">zoom</label>
  <input id="z" type="range" min="15" max="16" step="0.01" value="15">
  <span id="zoomLabel">15.00</span>
</div>
<div id="maps">
  <div class="pane"><div class="tag before">main<small>ramp stretched to zoom 16</small></div><div id="before" class="map"></div></div>
  <div class="pane"><div class="tag after">with fix<small>full height at zoom 15.1</small></div><div id="after" class="map"></div></div>
</div>

<script type="module">
import * as mainGl from './dist-main/maplibre-gl-dev.mjs';
import * as fixGl from './dist-fix/maplibre-gl-dev.mjs';

const CENTER = [-74.0092, 40.7089];
const HEIGHT = ['interpolate', ['linear'], ['zoom'], 15, 0, 15.1, ['get', 'render_height']];

function build(gl, container) {
    const map = new gl.Map({
        container,
        style: 'https://tiles.openfreemap.org/styles/bright',
        center: CENTER,
        zoom: 15,
        pitch: 60,
        bearing: -20,
        attributionControl: {compact: true}
    });
    map.on('load', () => {
        map.addLayer({
            id: 'buildings',
            source: 'openmaptiles',
            'source-layer': 'building',
            type: 'fill-extrusion',
            minzoom: 14,
            paint: {
                'fill-extrusion-color': '#b8c4d4',
                'fill-extrusion-height': HEIGHT,
                'fill-extrusion-opacity': 0.95
            }
        });
    });
    return map;
}

const maps = [build(mainGl, 'before'), build(fixGl, 'after')];

const slider = document.getElementById('z');
const label = document.getElementById('zoomLabel');
slider.addEventListener('input', () => {
    const zoom = parseFloat(slider.value);
    label.textContent = zoom.toFixed(2);
    for (const map of maps) map.setZoom(zoom);
});
</script>
</body>
</html>
