<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="system-ui, sans-serif">
  <rect width="960" height="440" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrowd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>

  <text x="240" y="32" text-anchor="middle" font-size="18" font-weight="600">Default LOD (relative to the view center)</text>
  <text x="720" y="32" text-anchor="middle" font-size="18" font-weight="600">Proposed override (relative to the camera)</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#555">Side view, fixed camera. Colored bands = tile zoom along the ground (red = fine, blue = coarse).</text>

  <!-- ===================== LEFT PANEL ===================== -->
  <g>
    <line x1="30" y1="270" x2="450" y2="270" stroke="#777" stroke-width="1.5"/>
    <circle cx="110" cy="130" r="6" fill="#111"/>
    <text x="110" y="115" text-anchor="middle" font-size="13">camera</text>

    <line x1="110" y1="130" x2="200" y2="266" stroke="#333" stroke-width="2.2" marker-end="url(#arrow)"/>
    <line x1="110" y1="130" x2="380" y2="266" stroke="#999" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrowd)"/>
    <text x="132" y="216" font-size="12.5" fill="#333">looking down</text>
    <text x="290" y="190" font-size="12.5" fill="#888">looking up</text>
    <text x="200" y="258" text-anchor="middle" font-size="11.5" fill="#333">center A</text>
    <text x="380" y="258" text-anchor="middle" font-size="11.5" fill="#888">center B</text>

    <!-- zoom bands, looking down: centered at x=200 -->
    <text x="55" y="296" text-anchor="end" font-size="11.5" fill="#333">zoom A</text>
    <g>
      <rect x="60"  y="286" width="60" height="12" fill="#2166ac"/>
      <rect x="120" y="286" width="50" height="12" fill="#92c5de"/>
      <rect x="170" y="286" width="60" height="12" fill="#b2182b"/>
      <rect x="230" y="286" width="50" height="12" fill="#f4a582"/>
      <rect x="280" y="286" width="60" height="12" fill="#92c5de"/>
      <rect x="340" y="286" width="80" height="12" fill="#2166ac"/>
    </g>
    <!-- zoom bands, looking up: centered at x=380, stretched -->
    <text x="55" y="322" text-anchor="end" font-size="11.5" fill="#888">zoom B</text>
    <g opacity="0.9">
      <rect x="60"  y="312" width="90" height="12" fill="#92c5de"/>
      <rect x="150" y="312" width="90" height="12" fill="#f4a582"/>
      <rect x="240" y="312" width="110" height="12" fill="#b2182b"/>
      <rect x="350" y="312" width="70" height="12" fill="#f4a582"/>
    </g>

    <text x="240" y="368" text-anchor="middle" font-size="14.5" fill="#b2182b">A pitch change moves the center:</text>
    <text x="240" y="388" text-anchor="middle" font-size="14.5" fill="#b2182b">the same ground gets different zooms, tiles reload</text>
  </g>

  <!-- ===================== RIGHT PANEL ===================== -->
  <g>
    <line x1="510" y1="270" x2="930" y2="270" stroke="#777" stroke-width="1.5"/>
    <circle cx="600" cy="130" r="6" fill="#111"/>
    <text x="600" y="115" text-anchor="middle" font-size="13">camera</text>

    <line x1="600" y1="130" x2="690" y2="266" stroke="#333" stroke-width="2.2" marker-end="url(#arrow)"/>
    <line x1="600" y1="130" x2="870" y2="266" stroke="#999" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrowd)"/>
    <text x="622" y="216" font-size="12.5" fill="#333">looking down</text>
    <text x="780" y="190" font-size="12.5" fill="#888">looking up</text>

    <!-- zoom bands centered under the camera, identical for both -->
    <text x="535" y="296" text-anchor="end" font-size="11.5" fill="#333">zoom A</text>
    <g>
      <rect x="540" y="286" width="20" height="12" fill="#92c5de"/>
      <rect x="560" y="286" width="20" height="12" fill="#f4a582"/>
      <rect x="580" y="286" width="40" height="12" fill="#b2182b"/>
      <rect x="620" y="286" width="60" height="12" fill="#f4a582"/>
      <rect x="680" y="286" width="100" height="12" fill="#92c5de"/>
      <rect x="780" y="286" width="120" height="12" fill="#2166ac"/>
    </g>
    <text x="535" y="322" text-anchor="end" font-size="11.5" fill="#888">zoom B</text>
    <g>
      <rect x="540" y="312" width="20" height="12" fill="#92c5de"/>
      <rect x="560" y="312" width="20" height="12" fill="#f4a582"/>
      <rect x="580" y="312" width="40" height="12" fill="#b2182b"/>
      <rect x="620" y="312" width="60" height="12" fill="#f4a582"/>
      <rect x="680" y="312" width="100" height="12" fill="#92c5de"/>
      <rect x="780" y="312" width="120" height="12" fill="#2166ac"/>
    </g>

    <text x="720" y="368" text-anchor="middle" font-size="14.5" fill="#1a7a3a">Zoom depends only on the distance to the camera:</text>
    <text x="720" y="388" text-anchor="middle" font-size="14.5" fill="#1a7a3a">pitch changes nothing, same position = same tiles</text>
  </g>
</svg>
